# Orwell's installers.
#
# Without a paid signature (macOS gets an ad hoc one, see `mac.identity`), with
# the cost spelled out on the downloads page: on macOS the first launch requires approval in System Settings,
# and on Windows the blue SmartScreen screen appears. It's the price of not
# paying annual rent to two companies to distribute our own code; the alternative
# costs 99 USD/year from Apple plus Windows certificate, saved for when there's
# a good reason.
#
# Defense against a tampered file is different, and it exists: each installer
# is published alongside its SHA-256 sum. See `scripts/publicar-instaladores.mjs`.

# Electron version, explicit not inferred.
#
# `package.json` declares a range (`^43.2.0`), which is what we want to get
# security fixes without editing anything. The packager needs an exact number-
# it downloads binaries from a specific version-and refuses to guess. When the
# range bumps a major, this number rises with it.
electronVersion: 43.8.10

# Names without spaces, with the OS explicit.
#
# NSIS called it "Orwell Setup 0.1.0.exe", and a space in a URL becomes %20-
# ugly to read and easy to break when someone copies the address into a message.
# The OS goes in the name because whoever downloads two similar files needs to
# know which one is theirs after they land in the same folder.
#
# The OS goes written in each target, not via `${os}`. That placeholder returned
# "macos"/"windows" in one build and "mac"/"win" in the next, and the result was
# a folder with four installers in two different names and a downloads page
# offering all four-two of them stale. Published names are also addresses people
# copy: they change when there's a reason, not when a dependency changes its mind.
artifactName: "${productName}-${version}-${arch}.${ext}"

appId: pt.orwell.app
productName: Orwell
copyright: "Copyright © 2026 Duarte Bivar"

directories:
  # `out/` is from electron-vite; installers go elsewhere to keep them separate
  # from built code.
  output: ../../.verify-data/instaladores
  buildResources: recursos

# What goes into the package, and nothing else. `out/` is what electron-vite
# produced; production `node_modules` are included by default.
files:
  - out/**/*
  - package.json

# The license (AGPL-3.0), copyright notice, and third-party notices, alongside
# the app (folder `resources/` on Windows, `Contents/Resources/` on macOS).
# AGPL and the third-party licenses bundled require the notice to travel with
# each copy. The file is generated by `scripts/gerar-avisos-de-terceiros.mjs`;
# a test fails if it goes stale.
extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt
  - from: ../../THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

# No auto-publish. Files are copied to the VPS by our script, and a forgotten
# `publish` here would try to talk to GitHub.
publish: null

mac:
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"
  target:
    # One universal DMG: one file for Intel and Apple Silicon. It costs about twice
    # the size and saves the question "which one is mine?"-which is where most
    # people give up.
    - target: dmg
      arch:
        - universal
  category: public.app-category.social
  # System audio when sharing the screen (macOS 14.2+). Without this key macOS
  # won't even ask, and the audio track arrives silent. See `somDoSistema` in
  # `src/main/ecra.ts`.
  #
  # The microphone and camera texts are Orwell's, not Electron's default ("This
  # app needs access to the microphone"): macOS shows them in its dialog, and a
  # dialog that does not say who asks and why reads as a trap.
  #
  # Bluetooth too. Orwell does not use Bluetooth: no code here calls Web
  # Bluetooth, and Bluetooth headphones and headsets reach the app through the
  # system audio (Core Audio), as any other microphone and speaker, with no
  # Bluetooth permission. Electron puts both keys in every app it builds, with
  # "This app needs access to Bluetooth", because Chromium has Bluetooth code
  # (Web Bluetooth, passkeys on a phone) that can start the Bluetooth stack, and
  # macOS then shows the dialog. If it appears, the text says the truth: saying
  # no changes nothing. The keys stay, because an app that starts the Bluetooth
  # stack without them is closed by macOS.
  extendInfo:
    NSAudioCaptureUsageDescription: "Orwell uses system audio when you share your screen in a call."
    NSMicrophoneUsageDescription: "Orwell uses the microphone when you speak in a call."
    NSCameraUsageDescription: "Orwell uses the camera when you turn on video in a call."
    NSBluetoothAlwaysUsageDescription: "Orwell does not use Bluetooth. Your Bluetooth headphones work without this permission. You can select Don't Allow."
    NSBluetoothPeripheralUsageDescription: "Orwell does not use Bluetooth. Your Bluetooth headphones work without this permission. You can select Don't Allow."
  # Ad hoc signature ("-"): a signature with no certificate and no team, on the
  # whole universal app, both slices and every helper.
  #
  # It is NOT the paid Apple signature, and it changes nothing for Gatekeeper:
  # the first launch still needs approval in System Settings. What it fixes is
  # the microphone (1.3.26). Up to 1.3.25 this said `identity: null`, and the
  # universal merge left the x86_64 slice with no signature at all. On an Intel
  # Mac, `tccd` then refuses the microphone WITHOUT asking ("Policy disallows
  # prompt", measured on macOS 26.5), and the call starts with silence. With an
  # ad hoc signature macOS asks, like for any app. The arm64 slice only worked
  # because the linker signs arm64 code by itself.
  #
  # No hardened runtime: with it, an ad hoc signature needs
  # `com.apple.security.cs.disable-library-validation` to start at all, and the
  # microphone and camera would need the `device.audio-input` and `device.camera`
  # entitlements. Without it, none of the three is needed. It only exists for
  # notarization, which this build does not do.
  #
  # Each version gets a new signature (its hash), so macOS asks again for the
  # microphone after each update. That is the cost of no certificate.
  identity: "-"
  hardenedRuntime: false
  # Notarization requires a paid signature; without it, this must stay off.
  notarize: false

dmg:
  # The drag-to-Applications window, which is the gesture everyone knows on macOS.
  # Default background with the arrow, 40 px less on top and room below for
  # the Ko-fi link (recursos/background.png and @2x, 540x460).
  background: background.png
  contents:
    - x: 130
      y: 180
    - x: 410
      y: 180
      type: link
      path: /Applications
    # Opens https://ko-fi.com/orwell_eu in the browser.
    - x: 270
      y: 330
      type: file
      path: recursos/Support Orwell.webloc

win:
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  # No signing: see the header.
  signAndEditExecutable: true

nsis:
  oneClick: false
  # Always English, whatever the Windows language. No language picker.
  multiLanguageInstaller: false
  installerLanguages:
    - en_US
  # The installer asks where to install. An installer that doesn't ask looks like
  # one hiding something.
  allowToChangeInstallationDirectory: true
  # Always "just for me", in %LOCALAPPDATA%\Programs\Orwell. Per-user
  # install updates without admin. The "for everyone or
  # just me" page is removed by `recursos/installer.nsh`: with `oneClick: false`,
  # this option can't be removed without also removing the folder choice. See the
  # header of that file.
  perMachine: false
  # No "for everyone" button for non-admins. The page no longer appears; this is
  # documented so it won't offer UAC again if someone restores it.
  allowElevation: false
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The installer artwork: direction B ("Banners"),
  # same as the boot screen. 24-bit BMP in the dimensions NSIS wants (164×314
  # sidebar, 150×57 header), in `recursos/`. The uninstaller sidebar is the same:
  # whoever uninstalls is leaving the same house. See `src/main/ecra-de-arranque.test.ts`.
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
  installerHeader: installerHeader.bmp

linux:
  # Not a target today, and it's documented: "right now we're PC only",
  # and an AppImage to build is better than one to test.
  target: []
