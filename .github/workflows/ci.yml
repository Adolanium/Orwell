# Checks every push and pull request: clean install, typecheck, the test
# suites and the audit of production dependencies.
#
# No secrets and no deploy: this runs the same on a fork as on the main repo,
# and it never talks to a live server. The tests start their own servers on
# the runner's loopback.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The server needs node:sqlite; production runs Node 24 (infra/Dockerfile).
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # Also builds the packages' dist/, which the suites below import.
        run: npm run typecheck

      # The headless Chromium for the one unit test that needs real layout
      # (packages/ui Timeline.transbordo.test.tsx), cached by Playwright version.
      # Without it that test failed on every run since at least 1.3.15.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install the Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test suites
        # The same loop as `npm test`, with one file left out (see "Known
        # unstable test") and the CPU timing tests skipped (see "Timing tests").
        env:
          ORWELL_SEM_TESTES_DE_TEMPO: "1"
        run: |
          falhados=""
          for pacote in packages/protocol packages/crypto packages/client-core apps/server packages/ui apps/web apps/client apps/site; do
            npx vitest run --root "$pacote" --exclude '**/session.perfis-entre-aparelhos.rede.test.ts' || falhados="$falhados $pacote"
          done
          if [ -n "$falhados" ]; then
            echo "Packages with failing tests:$falhados" >&2
            exit 1
          fi

      - name: Known unstable test (profiles across devices)
        # session.perfis-entre-aparelhos.rede.test.ts (two devices of one
        # account exchanging profiles over a real local server) fails about half
        # the time, on the released code as well. The cause is not found yet. It
        # runs here with retries, so the log still shows it, but it does not fail
        # the build. When it is fixed, move it back into the step above.
        continue-on-error: true
        run: npx vitest run --root packages/client-core src/session.perfis-entre-aparelhos.rede.test.ts --retry 2

      - name: Timing tests
        # Tests that measure this machine's CPU against a real-time budget
        # (the voice chain's cost per block). On a shared runner they miss by a
        # few hundredths of a millisecond with nothing changed, so they run
        # here, in the log, without failing the build. The required step skips
        # them with ORWELL_SEM_TESTES_DE_TEMPO=1.
        continue-on-error: true
        run: npx vitest run --root packages/client-core src/audio/cadeia.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
