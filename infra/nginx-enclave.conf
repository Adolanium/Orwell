# Host-nginx server block for orwell.pt (behind-proxy mode; see .env.example).
# On the VPS: copy to /etc/nginx/sites-available/orwell.pt, link into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# Certificates (only after DNS points here): `certbot --nginx -d orwell.pt -d www.orwell.pt`
#
# Everything proxies to the enclave web container on 127.0.0.1:8080, which
# serves the app and forwards /_enclave/* (gateway WebSocket included) to the
# homeserver container.
#
# This is the configuration production runs, minus nothing but the other sites
# on that host. No secrets live in it: the TLS keys are paths, and certbot owns them.

# --- http context ------------------------------------------------------------
#
# Files in sites-enabled/ are included inside `http { }`, so these work here.
# In production they sit in /etc/nginx/nginx.conf instead; nginx refuses a
# second definition of the same name, so keep them in one place only.

# The access log keeps the network, not the person. The "combined" format
# stored the full IP, the time to the second and the user agent of every
# request. This keeps the /24 (IPv4) or the /48 (IPv6): enough to see a scan
# or a broken network, not enough to point at one household.
map $remote_addr $ip_anon {
    ~(?P<a>\d+\.\d+\.\d+)\.    "$a.0";
    ~(?P<b>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:) "$b:";
    default                     "0.0.0.0";
}
log_format orwell '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent';

# WebSocket upgrade only when the client asks for one. Sending
# "Connection: upgrade" on every request is malformed and stops keepalive to
# the upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request and connection limits. They live in memory only.
limit_req_zone $binary_remote_addr zone=orwell:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=orwellconn:10m;

# --- servers -----------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name orwell.pt www.orwell.pt;
    # The redirects keep the same record as the app: without this they fall
    # back to the server-wide access.log, with the full IP and the browser.
    access_log /var/log/nginx/orwell.access.log orwell;
    return 301 https://orwell.pt$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.orwell.pt;

    ssl_certificate     /etc/letsencrypt/live/orwell.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orwell.pt/privkey.pem;

    access_log /var/log/nginx/orwell.access.log orwell;

    # Addresses embed "orwell.pt", never "www": one canonical name.
    return 301 https://orwell.pt$request_uri;
}

server {
    # http2 stated here, not inherited from whichever vhost declares the socket first.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orwell.pt;

    ssl_certificate     /etc/letsencrypt/live/orwell.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orwell.pt/privkey.pem;

    server_tokens off;

    # Frames carry base64 ciphertext of image posts; match the gateway's cap.
    client_max_body_size 24m;

    # Local-only access record, with the IP cut to the network (`$ip_anon`
    # above). It never sees content, which arrives here already encrypted.
    # Rotated by the stock nginx logrotate rule. `access_log off;` keeps nothing.
    access_log /var/log/nginx/orwell.access.log orwell;
    error_log /var/log/nginx/orwell.error.log;

    # Security headers, the same as the production vhost (ORW-05, 4 November
    # 2026). They live here at the server level, not in the Caddyfile:
    # in production this nginx sets them, and Caddy behind it would duplicate
    # each header. No `location` in this block may have its own `add_header`:
    # nginx would then stop inheriting all of these.
    #
    # The CSP mirrors the <meta> in apps/web/index.html, with three differences:
    # it drops the localhost ws://, adds frame-ancestors (impossible via <meta>)
    # and declares worker-src. The 'wasm-unsafe-eval' must be in both: the
    # browser enforces both policies, and without it in the header the gtcrn.wasm noise
    # reduction does not compile (blocked in production until 4/11/2026).
    # apps/site/testes/cabecalhos.test.ts reads this file and checks them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://orwell.pt; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Scanners: the app answers 200 with index.html to any path, /.env and
    # /wp-admin/ included, which makes the site look vulnerable to automated
    # scans and draws more of them. Real 404s, and no log line.
    location ~* (^|/)\.(env|git|svn|aws|ssh)(/|$) { access_log off; return 404; }
    location ~* \.(php|asp|aspx|jsp|cgi)$         { access_log off; return 404; }
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-login|wordpress|xmlrpc\.php|phpmyadmin|vendor)/ { access_log off; return 404; }

    location / {
        limit_req zone=orwell burst=40 nodelay;
        limit_req_status 429;
        limit_conn orwellconn 12;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The caller's IP, OVERWRITTEN, not appended (NET-01, 1.2.1): no
        # X-Forwarded-For sent by the client gets past this point. Caddy trusts
        # this hop (see infra/Caddyfile, trusted_proxies).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /_enclave/gateway, harmless for the rest.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A quiet chat socket is still a live socket; do not reap it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
